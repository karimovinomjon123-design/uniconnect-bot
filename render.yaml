services:
  - type: web
    name: uniconnect-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8786525548,7557420301"
      - key: REQUIRED_CHANNEL
        value: "@uniconnectuz_official"
      - key: REQUIRED_GROUP
        value: "@uniconnect_uz"
      - key: PORT
        value: "10000"
